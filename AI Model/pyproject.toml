[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asra-matcher"
version = "0.1.0"
description = "ASRA — AI Strategic Resource Allocator MVP for Let's Get Together (LGT)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Riipen / ASRA team" }]
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "google-genai>=0.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]

[project.scripts]
asra = "asra_matcher.cli:main"

[tool.setuptools.packages.find]
include = ["asra_matcher*"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that hit the real Gemini API (skip with -m 'not integration')",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]
