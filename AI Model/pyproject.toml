[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asra-matcher"
version = "0.1.0"
description = "ASRA — AI Strategic Resource Allocator MVP for Let's Get Together (LGT)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Riipen / ASRA team" }]
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "google-genai>=0.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
asra = "asra_matcher.cli:main"

[tool.setuptools.packages.find]
include = ["asra_matcher*"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that hit the real Gemini API (skip with -m 'not integration')",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# Deferred (tracked as follow-ups, not blocking this baseline):
#   E501  line length — style only; adopt `ruff format` to enforce later.
#   UP042 str-enum → StrEnum — a behavioural enum-base change across taxonomy/models.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# llm.py intentionally places a couple of imports next to the helpers that use
# them; api.py must call load_dotenv() before importing modules that read env
# at import time. Both are deliberate, so E402 is a false positive there.
"asra_matcher/llm.py" = ["E402"]
"asra_matcher/api.py" = ["E402"]
