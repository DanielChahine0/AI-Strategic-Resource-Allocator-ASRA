[project]
name = "asra-matcher"
version = "0.1.0"
description = "Retrieval-augmented matching engine pairing applicants with donated hardware for Let's Get Together (ASRA)."
requires-python = ">=3.11"
# Upper bounds cap the next major so a future release can't silently break the
# install (the previous unbounded ranges had already drifted chromadb 0.5 -> 1.x
# and google-genai 0.3 -> 2.x). Lower bounds reflect the majors the code is
# tested against.
dependencies = [
    "pydantic>=2.6,<3",
    "click>=8.1,<9",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "chromadb>=1.0,<2",
    "google-genai>=2.0,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-mock>=3.12,<4",
    "ruff>=0.6,<1",
]

[project.scripts]
asra-matcher = "asra_matcher.cli:main"

[tool.pytest.ini_options]
markers = [
    "integration: live-network test (requires GEMINI_API_KEY); skipped by default",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# Deferred (tracked as follow-ups, not blocking this baseline):
#   E501  line length — style only; adopt `ruff format` to enforce later.
#   UP042 str-enum → StrEnum — a behavioural enum-base change across taxonomy/models.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# llm.py intentionally places a couple of imports next to the helpers that use
# them; api.py must call load_dotenv() before importing modules that read env
# at import time. Both are deliberate, so E402 is a false positive there.
"asra_matcher/llm.py" = ["E402"]
"asra_matcher/api.py" = ["E402"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["asra_matcher*"]
