[project]
name = "asra-matcher"
version = "0.1.0"
description = "Retrieval-augmented matching engine pairing applicants with donated hardware for Let's Get Together (ASRA)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "click>=8.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "chromadb>=0.5.0",
    "google-genai>=0.3.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
asra-matcher = "asra_matcher.cli:main"

[tool.pytest.ini_options]
markers = [
    "integration: live-network test (requires GEMINI_API_KEY); skipped by default",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["asra_matcher*"]
